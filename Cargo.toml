[package]
name = "cashtrack"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
csv = "1.4.0"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
rust_decimal = { version = "1.42.1", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
